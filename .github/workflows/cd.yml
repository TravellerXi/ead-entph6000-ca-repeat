name: CD

# Continuous Delivery: promotion to AKS is deliberately gated on a manual
# dispatch or a successful CI run on main, so the change management process
# stays consistent and auditable.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      colour:
        description: Blue/green slot to make active
        required: true
        default: blue
        type: choice
        options: [blue, green]
      image_tag:
        description: Image tag to deploy
        required: false
        default: latest

permissions:
  # write is required because deployment happens by committing desired state,
  # not by calling the cluster. Pushes made with GITHUB_TOKEN do not start new
  # workflow runs, so this cannot recurse into CI.
  contents: write
  id-token: write

# Two overlapping deployments would race to write the same desired-state file.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NAMESPACE: ead-platform
  CHART_PATH: infrastructure/helm/ead-platform
  LIVE_VALUES: infrastructure/helm/ead-platform/values-live.yaml
  ARGO_APP: ead-platform
  GITOPS_BRANCH: deploy

jobs:
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: ${{ steps.expose.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deployment happens by pushing commits, so the checkout must be a
          # full clone of the branch Argo CD tracks, not the detached shallow
          # SHA that workflow_run checks out by default.
          fetch-depth: 0
          ref: deploy

      - name: Bring the GitOps branch up to the tested source revision
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Resolve current and target colour
        id: target
        # Git is the source of truth, so the currently active slot is read from
        # the committed desired state rather than from the cluster.
        run: |
          COLOUR="${{ github.event.inputs.colour || 'blue' }}"
          TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          if [ -f "$LIVE_VALUES" ]; then
            CURRENT=$(grep -E '^activeColour:' "$LIVE_VALUES" | awk '{print $2}')
          fi
          CURRENT="${CURRENT:-blue}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "colour=$COLOUR"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "active slot is '$CURRENT'; target slot is '$COLOUR'"

      # Phase 1: bring the target slot up to capacity WITHOUT moving the selector.
      # activeColour deliberately stays on the current slot.
      - name: Commit staged desired state (no traffic change)
        run: |
          # Docker repository names are lowercase; github.repository preserves
          # the owner's display case (TravellerXi), which is not a valid image path.
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          cat > "$LIVE_VALUES" <<EOF
          # GENERATED BY THE CD WORKFLOW - DO NOT EDIT BY HAND.
          # Argo CD reconciles the cluster toward this file; it is the deployment
          # request. Run ${{ github.run_id }}.
          activeColour: ${{ steps.target.outputs.current }}

          global:
            imageRepository: $REPOSITORY
            imageTag: "${{ steps.target.outputs.tag }}"

          reviewService:
            blueReplicas: 2
            greenReplicas: 2
          EOF
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LIVE_VALUES"
          git commit -m "chore(deploy): stage ${{ steps.target.outputs.colour }} at ${{ steps.target.outputs.tag }}" || echo "no change to stage"
          git push
          echo "staged_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for Argo CD to converge on the staged state
        run: bash scripts/wait-for-argocd.sh "$staged_sha"

      - name: Smoke test the staged slot while it is still receiving no traffic
        run: |
          kubectl -n "$NAMESPACE" rollout status \
            deployment/review-service-${{ steps.target.outputs.colour }} --timeout=5m

          # Addressed through the colour-pinned Service, not the production one.
          kubectl -n "$NAMESPACE" run "smoke-$RANDOM" --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            curl -fsS --max-time 10 \
              "http://review-service-${{ steps.target.outputs.colour }}:8080/actuator/health/readiness"

          kubectl -n "$NAMESPACE" run "smoke-api-$RANDOM" --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            curl -fsS --max-time 10 \
              "http://review-service-${{ steps.target.outputs.colour }}:8080/api/reviews/_meta"

      - name: Confirm production traffic is still on the previous slot
        run: |
          CURRENT=$(kubectl -n "$NAMESPACE" get svc review-service \
            -o jsonpath='{.metadata.annotations.ead\.tudublin\.ie/active-colour}')
          echo "selector still points at: $CURRENT"
          if [ "$CURRENT" = "${{ steps.target.outputs.colour }}" ]; then
            echo "::error::selector moved before the smoke test - staging overlay is wrong"
            exit 1
          fi

      # Phase 2: promotion. This commit changes the selector and nothing else.
      - name: Commit promotion (switch traffic to the verified slot)
        run: |
          sed -i "s/^activeColour: .*/activeColour: ${{ steps.target.outputs.colour }}/" "$LIVE_VALUES"
          git add "$LIVE_VALUES"
          git commit -m "chore(deploy): promote ${{ steps.target.outputs.colour }} to serve traffic"
          git push
          echo "promote_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for Argo CD to converge on the promotion
        run: bash scripts/wait-for-argocd.sh "$promote_sha"

      - name: Show the resulting traffic split
        run: |
          kubectl -n "$NAMESPACE" get svc review-service \
            -o jsonpath='{.metadata.annotations.ead\.tudublin\.ie/active-colour}{"\n"}'
          kubectl -n "$NAMESPACE" get endpoints review-service

      - name: Verify rolling-update services converged
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/recipe-service --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/user-service --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=5m

      - name: Expose public URLs for the report
        id: expose
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl -n "$NAMESPACE" get svc frontend \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 10
          done
          echo "frontend_url=http://$IP" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployed endpoints"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Frontend | http://$IP |"
            echo "| Active colour | ${{ steps.target.outputs.colour }} |"
            echo "| Image tag | ${{ steps.target.outputs.tag }} |"
            echo "| Pipeline run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record rollout history for the demo
        if: always()
        run: |
          kubectl -n "$NAMESPACE" rollout history deployment/recipe-service
          kubectl -n "$NAMESPACE" get svc review-service \
            -o jsonpath='{.metadata.annotations.ead\.tudublin\.ie/active-colour}'

  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the deployment commits can be reverted.
          fetch-depth: 0
          ref: deploy

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      # `helm rollback` would be undone by Argo CD's selfHeal within seconds,
      # because Git would still describe the failed state. Reverting the commit
      # is the only rollback that survives reconciliation.
      - name: Revert the deployment commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t bad < <(git log --format=%H -n 5 -- "$LIVE_VALUES")
          reverted=0
          for sha in "${bad[@]}"; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "chore(deploy): promote "*|"chore(deploy): stage "*)
                echo "reverting $sha ($subject)"
                git revert --no-edit "$sha"
                reverted=$((reverted + 1))
                ;;
              *) break ;;
            esac
          done

          if [ "$reverted" -eq 0 ]; then
            echo "::warning::no deployment commit found to revert"
            exit 0
          fi
          git push

      - name: Wait for Argo CD to restore the previous state
        run: bash scripts/wait-for-argocd.sh "$(git rev-parse HEAD)"

      - name: Report restored state
        run: |
          kubectl -n "$NAMESPACE" get svc review-service \
            -o jsonpath='{.metadata.annotations.ead\.tudublin\.ie/active-colour}{"\n"}'
          kubectl -n "$NAMESPACE" rollout status deployment/recipe-service --timeout=5m
