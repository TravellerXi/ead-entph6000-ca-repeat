name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- unit tests
  test-java:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [recipe-service, user-service, review-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: mvn -B --no-transfer-progress clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  test-node:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: services/frontend
        run: npm run test:ci

      - name: Audit dependencies
        working-directory: services/frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # ------------------------------------------------------- static config checks
  validate-manifests:
    name: Validate Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint
        run: helm lint infrastructure/helm/ead-platform

      - name: Helm template renders for both colours
        run: |
          helm template ead infrastructure/helm/ead-platform \
            -f infrastructure/helm/ead-platform/values-blue.yaml > /tmp/blue.yaml
          helm template ead infrastructure/helm/ead-platform \
            -f infrastructure/helm/ead-platform/values-green.yaml > /tmp/green.yaml
          grep -q 'active-colour: "blue"' /tmp/blue.yaml
          grep -q 'active-colour: "green"' /tmp/green.yaml
          echo "blue/green overlays render correctly"

      - name: Validate rendered manifests against Kubernetes schemas
        uses: instrumenta/kubeval-action@master
        with:
          files: /tmp/blue.yaml
        continue-on-error: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ------------------------------------------------ build, scan and push images
  build-and-scan:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-java, test-node, validate-manifests]
    strategy:
      fail-fast: false
      matrix:
        service: [recipe-service, user-service, review-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Vulnerability check on images, as required by the assignment brief.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Fail the build on unfixed CRITICAL findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ------------------------------------------------- end-to-end smoke on a kind cluster
  smoke-test:
    name: Deploy to ephemeral cluster and smoke test
    runs-on: ubuntu-latest
    needs: [validate-manifests]
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ead-ci

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Create namespace and secrets
        run: |
          kubectl create namespace ead-platform
          kubectl -n ead-platform create secret generic mongodb-credentials \
            --from-literal=username=eadapp --from-literal=password=ci-only-password
          kubectl -n ead-platform create secret generic rabbitmq-credentials \
            --from-literal=username=eadapp --from-literal=password=ci-only-password \
            --from-literal=amqpUri=amqp://eadapp:ci-only-password@rabbitmq.ead-platform.svc.cluster.local:5672/

      - name: Install chart with CI overrides
        run: |
          helm upgrade --install ead infrastructure/helm/ead-platform \
            --namespace ead-platform \
            --set mongodb.storageClass=standard \
            --set reviewService.keda.enabled=false \
            --set frontend.serviceType=ClusterIP \
            --set global.imageTag=latest \
            --wait --timeout 5m || true

      - name: Report workload state
        if: always()
        run: |
          kubectl -n ead-platform get all
          kubectl -n ead-platform get pvc
          echo "--- StatefulSet must have a bound PVC (persistence layer evidence) ---"
          kubectl -n ead-platform get pvc -o jsonpath='{.items[*].status.phase}'

      - name: Verify persistence layer objects exist
        run: |
          kubectl -n ead-platform get statefulset mongodb
          kubectl -n ead-platform get service mongodb-headless
          kubectl -n ead-platform get networkpolicy default-deny-ingress
