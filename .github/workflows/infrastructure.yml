name: Infrastructure

# Demonstrates the brief's requirement that the container orchestration system
# can be destroyed and recreated reliably and automatically.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options: [plan, plan-destroy, apply, destroy]

permissions:
  contents: read

env:
  TF_DIR: infrastructure/terraform
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    env:
      # The azurerm backend refuses Azure CLI authentication when the CLI is
      # logged in as a service principal. Terraform's native ARM variables
      # provide the supported non-interactive authentication path instead.
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    environment:
      # Mutating actions require a reviewer; both plan modes are read-only.
      name: ${{ (github.event.inputs.action == 'plan' || github.event.inputs.action == 'plan-destroy') && 'infrastructure-readonly' || 'infrastructure' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Verify state backend secrets are present
        # Fails with an actionable message instead of letting `init` emit an
        # opaque backend error when the one-off bootstrap has not been run.
        env:
          RG: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          SA: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          CT: ${{ secrets.TFSTATE_CONTAINER }}
        run: |
          missing=""
          [ -n "$RG" ] || missing="$missing TFSTATE_RESOURCE_GROUP"
          [ -n "$SA" ] || missing="$missing TFSTATE_STORAGE_ACCOUNT"
          [ -n "$CT" ] || missing="$missing TFSTATE_CONTAINER"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "Run scripts/bootstrap-state.sh once, then set them." >&2
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        # The backend block in providers.tf is deliberately empty so that no
        # state location is hard-coded in the repository; it is supplied here.
        # Without these values `init` cannot reach the remote state and the
        # destroy-and-rebuild requirement silently breaks on ephemeral runners.
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=ead.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'plan-destroy' || github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          destroy_flag=""
          if [ "${{ github.event.inputs.action }}" = "plan-destroy" ]; then
            destroy_flag="-destroy"
          fi
          terraform plan $destroy_flag -input=false \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="gitops_repo_url=${{ github.server_url }}/${{ github.repository }}.git" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform ${{ github.event.inputs.action }}"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publish outputs
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Cluster outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="gitops_repo_url=${{ github.server_url }}/${{ github.repository }}.git"
          echo "All billable resources removed." >> "$GITHUB_STEP_SUMMARY"
