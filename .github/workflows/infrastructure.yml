name: Infrastructure

# Demonstrates the brief's requirement that the container orchestration system
# can be destroyed and recreated reliably and automatically.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read

env:
  TF_DIR: infrastructure/terraform
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment:
      # apply/destroy require a reviewer, so infrastructure change stays a
      # deliberate, auditable step rather than an accident.
      name: ${{ github.event.inputs.action == 'plan' && 'infrastructure-readonly' || 'infrastructure' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform plan -input=false \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="gitops_repo_url=${{ github.server_url }}/${{ github.repository }}.git" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publish outputs
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Cluster outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="gitops_repo_url=${{ github.server_url }}/${{ github.repository }}.git"
          echo "All billable resources removed." >> "$GITHUB_STEP_SUMMARY"
